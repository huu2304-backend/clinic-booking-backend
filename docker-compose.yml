services:
  postgres:
    image: postgres:16-alpine
    container_name: cbs_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-cbs_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Chua co DB_PASSWORD - tao file .env tu .env.example truoc khi chay}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-cbs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
